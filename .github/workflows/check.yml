name: Check local workbench

on: [push, pull_request]

jobs:
  check:
    runs-on: windows-latest
    env:
      NCM_ENABLED: 'false'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: AgentBI/requirements-lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: Agent-vue/package-lock.json
      - run: python -m pip install -r AgentBI/requirements-lock.txt -r AgentBI/requirements.txt
      - run: python -m unittest discover -s AgentBI/tests -q
      - run: python scripts/check-startup.py
      - run: npm ci --no-fund --no-audit
        working-directory: Agent-vue
      - run: npm run build
        working-directory: Agent-vue
      - run: npm run test:unit
        working-directory: Agent-vue
